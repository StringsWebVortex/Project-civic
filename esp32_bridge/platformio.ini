[env:esp32_bridge]
platform  = espressif32
board     = nodemcu-32s
framework = arduino

; Partition table with SPIFFS (4MB flash: app 1.2MB + SPIFFS 2.6MB)
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

monitor_speed = 115200
upload_speed   = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    me-no-dev/AsyncTCP @ ^1.1.1
    me-no-dev/ESPAsyncWebServer @ ^1.2.3
