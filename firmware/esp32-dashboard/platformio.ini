[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = nodemcu-32s
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0 -std=gnu++17
lib_deps =
  links2004/WebSockets@^2.4.1
  ArduinoJson@^7.0.4
